<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meow 音源扩展</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --line: #e6e8ee;
    --text: #1f2329;
    --muted: #767c89;
    --accent: #2f6fed;
    --accent-soft: #eaf1ff;
    --ok: #1a9f5c;
    --bad: #d64545;
    --warn: #c9871a;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --card: #1e2128;
      --line: #2c313a;
      --text: #e8eaee;
      --muted: #98a0ae;
      --accent: #6a9bff;
      --accent-soft: #1e2a44;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 18px 48px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 18px; }
  h1 { font-size: 19px; margin: 0 0 4px; font-weight: 600; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .card h2 {
    font-size: 13px; font-weight: 600; margin: 0 0 12px;
    color: var(--muted); text-transform: uppercase; letter-spacing: .6px;
  }
  .status-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 12px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--line);
    font-size: 13px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--bad); }
  .dot.off { background: #b8bdc7; }
  .err {
    margin-top: 10px; font-size: 12.5px; color: var(--bad);
    background: color-mix(in srgb, var(--bad) 8%, transparent);
    border-radius: 8px; padding: 8px 10px; word-break: break-all;
  }
  label.field { display: block; margin-bottom: 14px; }
  label.field > span { display: block; font-size: 13px; margin-bottom: 6px; font-weight: 500; }
  .hint { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 4px; }
  input[type=text], input[type=password], input[type=number] {
    width: 100%; padding: 9px 11px; font-size: 13.5px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text);
    font-family: inherit;
  }
  input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .srcs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .src {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); cursor: pointer; font-size: 13px;
  }
  .src input { margin: 3px 0 0; flex: none; accent-color: var(--accent); }
  .src .nm { font-weight: 500; }
  .src .nt { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.35; margin-top: 2px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    padding: 9px 16px; font-size: 13.5px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    font-family: inherit; transition: .15s;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  button.primary:hover { filter: brightness(1.06); }
  button:disabled { opacity: .55; cursor: default; }
  .toggle { display: flex; align-items: center; gap: 9px; font-size: 13.5px; cursor: pointer; }
  .toggle input { width: 17px; height: 17px; accent-color: var(--accent); }
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: #23262e; color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: .22s; max-width: 86vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.bad { background: var(--bad); }
  .foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 20px; line-height: 1.9; }
  .test-out { margin-top: 12px; font-size: 12.5px; }
  .test-out ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
  @media (max-width: 520px) {
    .grid2 { grid-template-columns: 1fr; }
    body { padding: 14px 12px 40px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Meow 音源扩展</h1>
    <div class="sub">把 MeowMusicServer 的多源音乐接入飞牛音乐，官方曲库与在线搜索并存。</div>
  </header>

  <div class="card">
    <h2>运行状态</h2>
    <div class="status-row" id="statusRow">
      <span class="pill"><i class="dot"></i>正在读取…</span>
    </div>
    <div id="statusErr"></div>
  </div>

  <div class="card">
    <h2>Meow 上游</h2>
    <label class="field">
      <span>服务地址<span class="hint">含 http:// 或 https://，不带结尾斜杠</span></span>
      <input type="text" id="meowUrl" placeholder="http://192.168.2.220:2233" spellcheck="false">
    </label>
    <label class="field">
      <span>访问令牌<span class="hint" id="tokenHint">上游未启用鉴权时留空</span></span>
      <input type="password" id="meowToken" placeholder="留空表示不修改" autocomplete="new-password">
    </label>
    <div class="row">
      <button id="btnTest">测试连接</button>
      <span class="hint" id="testHint">会真实搜索一次「晴天」</span>
    </div>
    <div class="test-out" id="testOut"></div>
  </div>

  <div class="card">
    <h2>在线搜索</h2>
    <label class="toggle" style="margin-bottom:14px">
      <input type="checkbox" id="onlineEnabled">
      <span>在官方搜索结果后追加在线曲目</span>
    </label>

    <div style="margin-bottom:8px;font-size:13px;font-weight:500">
      启用的音源<span class="hint">全不选 = 由 Meow 自己决定</span>
    </div>
    <div class="srcs" id="srcList"></div>

    <div class="grid2" style="margin-top:16px">
      <label class="field">
        <span>单次拉取条数</span>
        <input type="number" id="searchLimit" min="1" max="200">
      </label>
      <label class="field">
        <span>搜索超时（秒）</span>
        <input type="number" id="searchTimeout" min="1" max="60">
      </label>
    </div>
  </div>

  <div class="row" style="justify-content:flex-end">
    <button class="primary" id="btnSave">保存配置</button>
  </div>

  <div class="foot">
    <div id="footInfo"></div>
    <div>官方音乐接口原样透传；在线曲目由 Meow 提供，实际可用性取决于上游与账号权益。</div>
  </div>
</div>
<div id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const state = { sources: [], chosen: new Set(), tokenSet: false };

  const toast = (msg, bad) => {
    const el = $('toast');
    el.textContent = msg;
    el.className = bad ? 'show bad' : 'show';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = ''; }, 2600);
  };

  const api = async (path, opts) => {
    const r = await fetch('./' + path, Object.assign({ headers: {} }, opts || {}));
    const text = await r.text();
    let data;
    try { data = JSON.parse(text); } catch { throw new Error('返回内容不是 JSON：' + text.slice(0, 120)); }
    if (!r.ok && !data.error) throw new Error('请求失败：HTTP ' + r.status);
    return data;
  };

  const pill = (label, kind, title) => {
    const span = document.createElement('span');
    span.className = 'pill';
    span.title = title || '';
    const dot = document.createElement('i');
    dot.className = 'dot ' + kind;
    span.appendChild(dot);
    span.appendChild(document.createTextNode(label));
    return span;
  };

  async function loadStatus() {
    const row = $('statusRow');
    const errBox = $('statusErr');
    try {
      const s = await api('api/status');
      row.textContent = '';
      row.appendChild(pill(s.upstream.ok ? '官方音乐正常' : '官方音乐异常', s.upstream.ok ? 'ok' : 'bad', s.upstream.socket));
      const online = s.online ? (s.meow.ok ? 'ok' : 'bad') : 'off';
      row.appendChild(pill(s.online ? (s.meow.ok ? 'Meow 已连接' : 'Meow 未连接') : '在线搜索已关闭', online, s.meow.url));
      if (s.online && s.meow.ok) row.appendChild(pill('已映射 ' + s.guid_map + ' 首', ''));
      const errs = [];
      if (s.upstream.error) errs.push('官方：' + s.upstream.error);
      if (s.meow.error) errs.push('Meow：' + s.meow.error);
      errBox.innerHTML = '';
      if (errs.length) {
        const d = document.createElement('div');
        d.className = 'err';
        d.textContent = errs.join('　|　');
        errBox.appendChild(d);
      }
      $('footInfo').textContent = '版本 ' + s.version + ' · 已运行 ' + Math.floor(s.uptime_s / 60) + ' 分钟';
    } catch (e) {
      row.textContent = '';
      row.appendChild(pill('状态读取失败', 'bad'));
      errBox.innerHTML = '';
      const d = document.createElement('div');
      d.className = 'err';
      d.textContent = e.message;
      errBox.appendChild(d);
    }
  }

  function renderSources() {
    const box = $('srcList');
    box.textContent = '';
    state.sources.forEach((src) => {
      const label = document.createElement('label');
      label.className = 'src';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = state.chosen.has(src.key);
      cb.addEventListener('change', () => {
        if (cb.checked) state.chosen.add(src.key); else state.chosen.delete(src.key);
      });
      const info = document.createElement('span');
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = src.label;
      info.appendChild(nm);
      if (src.note) {
        const nt = document.createElement('span');
        nt.className = 'nt';
        nt.textContent = src.note;
        info.appendChild(nt);
      }
      label.appendChild(cb);
      label.appendChild(info);
      box.appendChild(label);
    });
  }

  async function loadConfig() {
    const [cfg, srcs] = await Promise.all([api('api/config'), api('api/sources')]);
    state.sources = srcs.sources || [];
    state.chosen = new Set(cfg.sources || []);
    state.tokenSet = !!cfg.token_set;

    $('meowUrl').value = cfg.meow_url || '';
    $('meowToken').value = '';
    $('tokenHint').textContent = state.tokenSet ? '已设置，留空则不修改' : '上游未启用鉴权时留空';
    $('searchLimit').value = cfg.search_limit || 30;
    $('searchTimeout').value = cfg.search_timeout_s || 5;
    $('onlineEnabled').checked = !!cfg.online_enabled;
    renderSources();
  }

  $('btnTest').addEventListener('click', async () => {
    const btn = $('btnTest');
    btn.disabled = true;
    $('testOut').textContent = '正在测试…';
    try {
      const r = await api('api/test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ meow_url: $('meowUrl').value.trim() })
      });
      const out = $('testOut');
      out.textContent = '';
      if (!r.ok) {
        const d = document.createElement('div');
        d.className = 'err';
        d.textContent = r.error || '测试失败';
        out.appendChild(d);
      } else {
        const p = document.createElement('div');
        p.textContent = '连接正常，搜索「' + r.query + '」返回 ' + r.count + ' 条';
        if (r.warning) p.textContent += ' — ' + r.warning;
        out.appendChild(p);
        if (r.samples && r.samples.length) {
          const ul = document.createElement('ul');
          r.samples.forEach((s) => {
            const li = document.createElement('li');
            li.textContent = s.title + ' — ' + (s.artist || '未知') + (s.source ? '（' + s.source + '）' : '');
            ul.appendChild(li);
          });
          out.appendChild(ul);
        }
      }
    } catch (e) {
      $('testOut').textContent = '';
      const d = document.createElement('div');
      d.className = 'err';
      d.textContent = e.message;
      $('testOut').appendChild(d);
    } finally {
      btn.disabled = false;
    }
  });

  $('btnSave').addEventListener('click', async () => {
    const btn = $('btnSave');
    btn.disabled = true;
    const payload = {
      meow_url: $('meowUrl').value.trim(),
      sources: Array.from(state.chosen),
      search_limit: parseInt($('searchLimit').value, 10) || 30,
      search_timeout_s: parseInt($('searchTimeout').value, 10) || 5,
      online_enabled: $('onlineEnabled').checked
    };
    const token = $('meowToken').value.trim();
    if (token) payload.meow_token = token;
    try {
      const r = await api('api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!r.ok) throw new Error(r.error || '保存失败');
      toast('已保存，立即生效');
      await loadConfig();
      await loadStatus();
    } catch (e) {
      toast(e.message, true);
    } finally {
      btn.disabled = false;
    }
  });

  loadConfig().catch((e) => toast('配置读取失败：' + e.message, true));
  loadStatus();
  setInterval(loadStatus, 15000);
})();
</script>
</body>
</html>
